[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timbre-palette-api"
version = "2.0.0"
description = "API pública para retratos instrumentais de perfis do Last.fm."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "uv",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["palette_api*"]
exclude = ["palette_api.tools*"]

[tool.setuptools.package-data]
palette_api = ["_generated_image_catalog.json"]
