[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "timbre-palette-server-assembly-reference"
version = "2.1.1"
description = "Local reference for server-side profile assembly."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "uv",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["reference/server-assembly/src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["reference/server-assembly/src"]
include = ["palette_api*"]

[tool.setuptools.package-data]
palette_api = ["_generated_image_catalog.json", "_curated_example_history.json"]
