[package]
name = "musicbrainz-etl"
version = "0.1.0"
edition = "2024"
description = "Single-pass MusicBrainz dump materializer for Timbre Palette"
license = "GPL-3.0-only"

[dependencies]
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
